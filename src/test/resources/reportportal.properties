# URL of your ReportPortal server instance
rp.endpoint = https://reportportal.empire.ca

# Your Personal API Key (Profile -> API Keys in ReportPortal UI)

# The project name in ReportPortal (case-sensitive)
rp.project = playwrightautoamtion-qat

# The name of the launch/suite run
rp.launch = Playwright_Automation_Suite

# Optional settings
rp.enable = true
rp.mode = DEFAULT
rp.skipped.issue = true
rp.http.logging = true