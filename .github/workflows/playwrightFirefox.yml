name: Playwright Tests - Firefox
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # Set up Java 21 on the Ubuntu runner
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests - Regression - Firefox Eng 
      run: ./run-tests.sh -Dbrowser=firefox -Ddevice="Desktop" -Dcucumber.filter.tags="@EN"

    - name: Run Playwright tests - Regression - Firefox - Fr 
      run: ./run-tests.sh -Dbrowser=firefox -Ddevice="Desktop" -Dcucumber.filter.tags="@FR"

    - name: Run Playwright tests - Regression - Firefox - Mobile - EN 
      run: ./run-tests.sh -Dbrowser=firefox -Ddevice="iPhone 13 Pro" -Dcucumber.filter.tags="@EN"

    - name: Run Playwright tests - Regression - Firefox - Mobile - FR
      run: ./run-tests.sh -Dbrowser=firefox -Ddevice="iPhone 13 Pro" -Dcucumber.filter.tags="@FR"

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30