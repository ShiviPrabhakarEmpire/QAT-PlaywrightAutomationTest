plugins {
    id 'java'
    id 'application'
}

group = 'com.qat'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.microsoft.playwright:playwright:1.55.0'
    
    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.18.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.0'
    testImplementation 'io.cucumber:cucumber-picocontainer:7.18.0'

    // Parity Testing Dependencies
    testImplementation 'com.github.romankh3:image-comparison:4.4.0'
    testImplementation 'org.jsoup:jsoup:1.18.1'
    testImplementation 'org.xmlunit:xmlunit-core:2.10.0'
    testImplementation 'org.xmlunit:xmlunit-assertj3:2.10.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.qat.playwright.BrowserLauncher'
}

tasks.register('installBrowsers', JavaExec) {
    group = 'playwright'
    description = 'Install the Chromium, Firefox, and WebKit browser binaries.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install'
}

tasks.register('installPlaywrightDeps', JavaExec) {
    group = 'playwright'
    description = 'Install OS dependencies for Playwright browsers.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install-deps'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        if (project.hasProperty('parity')) {
            includeTags 'parity'
        } else {
            excludeTags 'parity'
        }
    }
    
    // Pass base.url and target.url system properties dynamically with default fallback
    systemProperty 'base.url', System.getProperty('base.url', 'https://www.empire.ca')
    systemProperty 'target.url', System.getProperty('target.url', 'https://www.empire.ca/fr')
    
    // Pass all system properties to the test JVM
    systemProperties System.properties

    // Optional: output test progress to console
    testLogging {
        events "passed", "skipped", "failed"
    }
}
task parityTest(type: JavaExec) {
    description = 'Runs Cucumber parity tests'
    group = 'verification'

    // Ensure test code compiles first
    dependsOn compileTestJava

    // Supply the test runtime classpath (includes JSoup, Playwright, Cucumber, etc.)
    classpath = sourceSets.test.runtimeClasspath

    // Execute Cucumber CLI runner
    mainClass = 'io.cucumber.core.cli.Main'

    // Cucumber CLI arguments
    args = [
            '--plugin', 'pretty',
            '--plugin', 'html:build/reports/tests/parity-report.html',
            '--glue', 'com.qat.playwright',
            'src/test/resources/features/parity'
    ]
}