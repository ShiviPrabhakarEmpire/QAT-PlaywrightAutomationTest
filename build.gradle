plugins {
    id 'java'
    id 'application'
}

group = 'com.qat'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.microsoft.playwright:playwright:1.55.0'
    
    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.18.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.0'

    // Cucumber + Playwright existing dependencies...

    // ReportPortal Cucumber JVM agent
    testImplementation 'com.epam.reportportal:agent-java-cucumber7:5.4.10'

    // (Optional) Logger adapter if you use Logback or Log4j2
    testImplementation 'com.epam.reportportal:logger-java-logback:5.2.2'

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.qat.playwright.BrowserLauncher'
}

tasks.register('installBrowsers', JavaExec) {
    group = 'playwright'
    description = 'Install the Chromium, Firefox, and WebKit browser binaries.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install'
}

tasks.register('installPlaywrightDeps', JavaExec) {
    group = 'playwright'
    description = 'Install OS dependencies for Playwright browsers.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install-deps'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    
    // Pass all system properties to the test JVM
    systemProperties System.properties

    // Optional: output test progress to console
    testLogging {
        events "passed", "skipped", "failed"
    }
}